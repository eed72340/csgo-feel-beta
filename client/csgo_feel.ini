# v2 preview. Bob is driven only by real server telemetry (velocity / onground);
# nothing here guesses movement from the keyboard. Requires -insecure and the
# server-side CSGO_FEEL_LOCAL_STEAMID. Gameplay/weapon timing stays native.
# F8 toggles this client locally (does not change server prefs).
enabled=1
bob=1
# xscale is horizontal; yscale is the historical name for VERTICAL Z scale.
xscale=0.020
yscale=0.020
diagnostics=0
# Bob amplitudes come from server PlayerPrefs; legacy default.cfg: lat=.33 vert=.14.

# ---- 切枪动画（换枪时枪模先下沉再回弹）
# 0 是本地否决：服务端 csgo_qieqiang 1 也开不起来。
qieqiang=1
# 下沉深度（viewmodel_offset 单位）：曲线最低点就是这个值，首尾都回到原位。
qieqiang_amount=0.55
# 整个动画时长（秒）。这就是从按下切枪到枪模回到原位的总时间。
qieqiang_time=0.35
# 1 = 本地窗口消息（滚轮 / 侧键 / 1~5 / Q）当主触发，按下即播，和游戏的起枪动画同一帧。
# 0 = 只等服务端 item_equip 事件，晚 40~80ms，会明显跟不上。
# 只有在聊天框里打字会被误判，200ms 内服务端没确认会自动撤掉。
input_trigger=1

# ---- 枪口上扬（跟随引擎真实后坐角；读不到时退回开火计数近似）
recoil=1
# 每发子弹的枪模下沉量（viewmodel_offset 单位）。仅在拿不到真实后坐角时使用。
recoil_kick=0.30
# 真实后坐角的换算增益：offset = -punchPitch * gain * viewmodel_recoil_scale。
# 允许负数：如果开火时枪模往下走，把这里取反。
recoil_punch_gain=0.35

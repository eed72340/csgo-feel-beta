# CS:GO 手感客户端 - bob / 切枪参数
# 改完重新注入生效；F8 可随时急停 / 恢复
# 说明：x/y 是 viewmodel_offset_x / viewmodel_offset_y 的换算倍率，
# 觉得晃得太夸张就调小（0.01 很轻，0.04 很猛）

enabled=1
bob=1
new_bob=0
lower=21
lat=0.4
vert=0.25
cycle=0.98
shift_left=1.5
shift_right=0.75
xscale=0.020
yscale=0.020
run_speed=250
walk_speed=130
crouch_speed=85

# 切枪动画：换枪时枪模先下沉再回弹（模拟 CS:GO 起枪）
# qieqiang=1 开启，0 关闭；amount 是下沉幅度，time 是回弹时长（秒）
qieqiang=1
qieqiang_amount=0.55
qieqiang_time=0.35

# wheel=1：鼠标滚轮 / 侧键切枪也播动画（默认开）；0 则只认数字键 1~5 和 Q
wheel=1

# server_sync=1：服务端插件在线时，开关与幅度以服务端为准
#   控制台 csgo_qieqiang 0|1|toggle、csgo_qieqiang amt 0.7、聊天 !qieqiang 立刻生效
# server_sync=0：完全按本文件的配置走
# 注意：上面的 qieqiang=0 是本地否决，写了 0 之后服务端也开不起来
server_sync=1

# diagnostics=0（默认）：注入时不做内存诊断。
# 诊断会在 client.dll 的可写节里逐指针反查、并往日志刷几十 KB，
# 注入后那几秒卡顿主要来自它。只有排查「RVA 又失效了 / ConVar 找不到」时才改成 1。
diagnostics=0

toggle_key=119
